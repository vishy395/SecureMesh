[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "securemesh"
version = "0.1.0"
description = "Cryptographic command and telemetry network for simulated IoT devices"
requires-python = ">=3.11"
dependencies = ["cryptography>=42,<47", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-dotenv>=1,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["securemesh*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
